# Alembic config for the job-copilot store. The database URL is NOT set here: env.py reads
# it from DATABASE_URL, or falls back to the local SQLite file, so one config serves both
# run modes and no connection string is ever committed.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
