# Question taxonomy — config-driven, per-company overridable.
#
# A form field's question text (label / name / placeholder) is matched
# case-insensitively (regex) against each bucket's patterns, in `priority` order.
# First match wins. No match -> field falls through to Tier 1 (Claude field-mapping).
#
#   deterministic -> Tier 0: silent autofill from profile.json (value_key)
#   draftable     -> Tier 2: Claude drafts from answer_bank, user approves (answer_key)
#   always_ask    -> never auto-filled; always surfaced to the user (phone)
#
# A deterministic rule may also carry `alternates: [...]` — a SECOND, THIRD, … answer to
# try when the first one matches none of the control's options. This exists because the
# same question text can front two different widget kinds: "Phone Number" labels a text
# box on most boards and, on Ashby, an SMS-consent Yes/No group. Rather than reorder the
# rules (which changes what wins everywhere) or guess the widget from the label (which is
# what the label cannot tell us), the rule names its fallbacks and the fill engine walks
# them in order, keeping the first that the control actually accepts.
#
# Each entry is either a dotted profile path (resolved against profile.json — this is the
# common case) or, if it resolves to nothing, the literal string itself. Per-value
# fallbacks that are about the ANSWER rather than the question — tenant wordings, ranked
# preferences — belong in profile.json's `answer_alternates` instead, keyed by value_key;
# both sources are tried, rule alternates first.
#
# always_ask is checked FIRST so a "current salary" field can never be captured by a
# looser deterministic rule. Per-company overrides (bottom) prepend extra patterns to a
# bucket for that company only — e.g. force a dream company's "why us" to always_ask.

priority: [always_ask, deterministic, draftable]

buckets:

  # --- Tier 0: deterministic autofill. value_key indexes into profile.json ---
  deterministic:
    # MUST be first, and MUST sit above the require-sponsorship rule: inverted/compound
    # sponsorship phrasing — "able to work WITHOUT sponsorship?" / "authorized to work and
    # will NOT require sponsorship?" — is the sponsorship question with flipped polarity.
    # For anyone already authorized without sponsorship the answer is Yes. Without this
    # rule the require-sponsorship rule below renders "No" = wrong-polarity knockout.
    - {pattern: '(without|will not|won''?t|do(es)? not|don''?t|\bnot\b).{0,30}(require|need).{0,25}sponsor|(able|authorized|eligible|can you|are you able).{0,60}without.{0,35}sponsor', value_key: work_authorization.authorized_us}
    # Sponsorship questions often say "...sponsorship to work in the COUNTRY in which the
    # job is located..." and the generic \bcountry\b address rule below would otherwise
    # grab it and fill a country name into a Yes/No field. This rule is specific
    # (require/need + sponsor) so putting it near the top is safe.
    - {pattern: 'require.*sponsor|need.*sponsor|visa sponsor|sponsorship (now|in the future|required|for)', value_key: work_authorization.require_sponsorship}
    # Referral source is hoisted here, above the phone/zip/portfolio rules: "How did you
    # hear about <company>?" must never be captured by a substring hiding in the company
    # name (Zipline -> zip, T-Mobile -> mobile). The phrasing is ultra-specific, so
    # placing it this early is safe.
    - {pattern: 'how (did|do) you (first |initially |originally )?(hear|learn|find out)|how were you referred|(hear|learn) about (us|this|the (role|position|job|company))|referral source|source of application', value_key: preferences.referral_source}

    # ── OBSERVED PHRASINGS — an APPEND-ONLY rule book ────────────────────────────
    # Exact question wordings seen on real boards that the general rules further down
    # miss. Read `logs/fill_reports.jsonl` after a run: anything in `questions` whose
    # `why` is "unrecognized required field" or "no rule matched" is a candidate, and
    # if profile.json already holds the answer it belongs here. Append freely — that is
    # the point of the block.
    #
    # WHY THEY LIVE UP HERE, not next to their own value_key's general rule: each is a
    # near-verbatim question sentence, so it is far more specific than anything below
    # and cannot be stolen from a looser rule by accident. Same reasoning that already
    # hoists the referral-source rule above the phone/zip rules. (always_ask is a
    # separate bucket checked BEFORE this one, so nothing here can outrank it.)
    #
    # THE TRAP THESE AVOID: several general rules below deliberately end-anchor with
    # `\s*[:*]?\s*$` to exclude a trailing "?", because that is what stops an essay
    # ("Why do you want to leave your current employer?") from being answered with a
    # value. Widening those anchors to admit "?" would reopen exactly that hole — live
    # proof: Babel Street asks "is <company> considered a competitor to your most
    # recent employer?", which is a Yes/No and must NOT be filled with an employer
    # name. So these rules keep the interrogative lead-in ("what is your…") instead,
    # which is specific enough to tell the two shapes apart.
    #
    # Each entry ends with the board it was observed on and the date.
    - {pattern: '(what|which) (is|was) your most recent (company|employer)', value_key: employment.current_employer}   # SentiLink
    - {pattern: '(what|which) (is|was) your most recent (job )?(title|role|position)', value_key: employment.current_title}  # SentiLink
    - {pattern: 'country do you currently (reside|live)|(what|which) country are you (based|located|living) in', value_key: identity.address.country}  # DV Trading / Nova Talent
    # "Do you live in the US…?" and "Are you based in a US equivalent timezone?" are
    # Yes/No, so the country rules above would answer "United States" and match nothing.
    - {pattern: '(live|living|reside|residing|based) in the (us\b|u\.s\.|usa|united states)|u\.?s\.? equivalent time ?zone', value_key: identity.based_in_us}  # SentiLink / Nova Talent
    # "Military status" never contains the word "veteran", so the veteran rule missed it.
    - {pattern: 'military status|military service', value_key: eeo.veteran_status}   # Robinhood
    # The general previously_employed rule needs "us"/"this company"/"before" within 25
    # chars of the verb; a board that names itself ("worked for Robinhood as an…") blows
    # that budget, and we cannot know the company name at pattern-write time.
    - {pattern: '(have|had) you ever (worked|been employed|interned) (for|at|with|by)\b', value_key: affiliations.previously_employed}  # Robinhood
    - {pattern: 'how did you discover (us|our)|where did you (find|discover) (us|this)', value_key: preferences.referral_source}  # Luma AI
    # "locations ARE YOU open to" has a word between "locations" and "you", which the
    # general locations rule's `locations? you.{0,15}open` alternative cannot span.
    - {pattern: 'locations? are you open to|open to working (from|in)|preferred office location|office location preference', value_key: preferences.locations}  # SentiLink / Robinhood
    # An honest SMS-consent label. When the group is instead mislabelled with the phone
    # field's own text (Ashby does this — see the phone rule's `alternates`), the phone
    # rule catches it and falls back to this same value.
    - {pattern: 'consent to receiv\w*.{0,20}text|text message|\bsms\b', value_key: attestations.sms_consent}  # SentiLink
    # Standardized admissions tests, asked as required pick-lists of score bands plus a
    # "Not applicable/Do not recall" row. Anyone schooled outside the US track, or who
    # simply never sat one, wants that row — and whether you sat a test is a fact about
    # YOU, so it reads from its own profile key and is never assumed here rather
    # than being left to fall through. "score" must follow within a few characters: bare
    # \bact\b is an ordinary English verb and would otherwise capture half the form.
    - {pattern: '\b(sat|act|gre|gmat|lsat|mcat|toefl|ielts)\b[^?]{0,12}scores?\b|standardized test', value_key: education.standardized_tests}  # SpaceX
    # "SpaceX & SpaceXAI Employment History" is the have-you-worked-here disclosure wearing
    # a noun-phrase label: no verb at all, so the "have you ever worked for…" rule above
    # cannot see it. Guarded to a LIST of company names ("X & Y Employment History") so a
    # plain "Employment History" textarea — which wants a résumé, not "No" — never matches;
    # a per-company override would have been tighter, but overrides key on an exact company
    # string and the reports spell this one both "SpaceX" and "Spacex".
    - {pattern: '\S+\s*(&|and|/|,)\s*\S+\s+employment history', value_key: affiliations.previously_employed}  # SpaceX
    # "Are you currently an employee or contractor at Abnormal? (if Yes, please add your
    # Abnormal email in the email section of the application page)" is a Yes/No dropdown.
    # Its parenthetical contains "email", so the generic identity.email rule matched it and
    # the fill offered your address to a list of Yes and No. This rule sits above the
    # identity block so it is tested first. It covers the employee and contractor wording
    # only. "Are you currently employed" asks about your own job and has a different answer,
    # and "former employee" belongs to previously_employed.
    #
    # Because it sits this high, it is also tested before the government and
    # external-business rules. The lookaheads decline the wordings those rules own:
    #   "Are you an employee referral?"                         -> a referral source
    #   "Are you currently an employee of a government agency?" -> government_affiliation
    # test_taxonomy_routing.py pins these pairs.
    - {pattern: '\bare you (currently |presently )?(an?|the )?\s*(current |existing )?(employee|contractor|intern|consultant)\b(?!\s+referral)(?!.{0,30}\b(government|public official|state-owned|politically exposed|competing business|outside business)\b)|\bare you (currently |presently )?employed (by|at|with)\b(?!.{0,30}\b(government|customer|partner|client|vendor|supplier|competitor)\b)', value_key: affiliations.current_employee}  # Abnormal Security
    # ── end observed phrasings ───────────────────────────────────────────────────

    - {pattern: '\bfirst name\b',                                   value_key: identity.first_name}
    # "Preferred name" / "what should we call you" is the applicant's given name (Parth),
    # NOT a work-location preference — sits above the preferred-city/location rules below,
    # and won't collide with them (they anchor on city/location, this anchors on name).
    - {pattern: 'preferred (first )?name|what (name )?(should we call you|do you (go by|prefer))|\bnickname\b|\bgoes by\b', value_key: identity.first_name}
    - {pattern: '\blast name\b|\bsurname\b|\bfamily name\b',        value_key: identity.last_name}
    - {pattern: '\bfull name\b|^name$|your name|legal name',        value_key: identity.full_name}
    - {pattern: 'e-?mail',                                          value_key: identity.email}
    # mobile/cell word-bounded: bare substrings caught "T-Mobile"/"misCELLaneous" etc.
    # `alternates`: Ashby renders its SMS-consent radio group INSIDE the phone field's
    # wrapper, so the group inherits the label "Phone Number" and this rule wins — then
    # the phone number matches neither "Yes - I consent to receiving text messages" nor
    # "No - …", and SentiLink flagged it on every single run. The consent value is the
    # right answer for that widget, so try it once the number fails to match. A real
    # phone text box never reaches the fallback (setText always accepts).
    - {pattern: '\bphone\b|\bmobile\b|telephone|\bcell\b',          value_key: identity.phone, alternates: [attestations.sms_consent]}
    - {pattern: 'linkedin',                                         value_key: links.linkedin}
    - {pattern: 'github|git hub',                                   value_key: links.github}
    # url word-bounded: bare "url" caught "hoURLy rate" and silently skipped a comp question
    - {pattern: 'portfolio|personal (web ?site|site)|\bwebsite\b|\burl\b', value_key: links.portfolio}
    # Twitter/X: Parth has none -> renders "" (intentional blank, skipped silently) like
    # portfolio, rather than escalating to Telegram on every form that asks for it.
    - {pattern: '\btwitter\b|\bx handle\b|x \(formerly twitter\)',   value_key: links.twitter}
    - {pattern: 'street address|address line|mailing address',     value_key: identity.address.line1}
    # RELOCATION AND ONSITE QUESTIONS MUST BEAT THE ADDRESS RULES BELOW.
    #
    # A relocation question names the office it is asking you to move to, and offices sit in
    # cities: "If not currently in the Bay Area, are you willing to relocate near our Foster
    # City, CA Office?" contains the word "City", so the \bcity\b rule below claimed it and
    # answered a Yes/No group with the applicant's OWN home city. Flagged on every Replit
    # run (logs/fill_reports.jsonl 2026-07-23, 2026-08-05), and it is not a Replit quirk:
    # Foster City, Redwood City, Culver City, Kansas City, Salt Lake City, Jersey City and
    # New York City all put a city name inside the question. The fix is precedence, not one
    # more pattern — these rules used to live further down, below the whole address block.
    #
    # Relocation ASSISTANCE (money/support) is a different question from willingness to
    # relocate — Parth's decision (2026-07-12): answer No. Must stay directly above the
    # broad relocation rule, which would otherwise answer Yes.
    - {pattern: 'relocation (assistance|package|support|bonus|benefit)|assist\w*.{0,20}relocat', value_key: preferences.relocation_assistance_needed}
    - {pattern: 'willing to relocate|open to relocation|able to relocate|relocat',           value_key: work_authorization.relocation}
    # The onsite half of the same trap, from the same two Replit runs: "Are you able to work
    # from our Foster City, CA HQ 3 days per week?" got the home city too. Fixing precedence
    # alone would not have saved it — the in-office acknowledgment rule further down keys on
    # "onsite"/"acknowledge"/"come into the office", and this phrasing says none of them, so
    # the question would merely have fallen through to Claude instead. Anchored on working
    # FROM a named office/HQ, which is a commitment question and always Yes/No.
    #
    # THE LEADING GUARD IS LOAD-BEARING. Some boards fold "do you already live here?" into
    # the same sentence — Harvey asks "…expected to work from the office 3 days per week …
    # Are you CURRENTLY BASED in the listed location and able to work in person 3 days per
    # week?" over the options "Yes, I'm based in this location…" / "No, I'm not based in
    # this location but willing to relocate" / "No, I'm only able to work remotely". A bare
    # Yes there is a false statement about where the applicant lives, and it would
    # win, because "Yes" whole-word-matches the first option before matchOption's
    # relocation branch ever runs. Willingness is not residency: when a question asks about
    # both, this rule steps aside and the field is surfaced instead of answered.
    - {pattern: '^(?!.*\b(currently|presently)\s+(based|located|living|residing)\b).*((able|willing|open|available|comfortable) to work (from|out of|at)\b[^?]{0,60}(office|hq|headquarters)|work (from|out of|at) (our|the)\b[^?]{0,45}(office|hq|headquarters))', value_key: attestations.in_office_acknowledgment}
    # Combined "City, State" / "City and State" fields need the full display string, and
    # "Preferred City" is a work-location preference, not the home address — both MUST sit
    # above the bare \bcity\b rule or it captures them and fills just the city name.
    - {pattern: 'city\s*,\s*state|city\s*/\s*state|city and state', value_key: identity.location_display}
    - {pattern: 'preferred (city|location)|desired (city|location)', value_key: preferences.locations}
    - {pattern: '\bcity\b',                                         value_key: identity.address.city}
    # Anchored: bare \bstate\b caught the VERB "state" ("Please state your reasons...")
    # and shadowed later rules ("state-owned", EEO labels citing "state and federal law").
    # Renders the FULL state name (e.g. "Illinois"), not the "IL" abbreviation: state fields are
    # frequently react-selects whose options are full names, so a 2-letter code never matches the
    # full-name option (a silent miss on a required field). Full name types fine into plain
    # text state fields too. Structured address.state stays the 2-letter code for
    # address-object uses.
    - {pattern: '^\s*state\s*[?:*]?\s*$|state (of residence|you (live|reside))|which state|what state do|state\s*/\s*province|\bprovince\b|\bregion\b', value_key: identity.address.state_full}
    # zip word-bounded: bare "zip" caught company names ("How did you hear about Zipline?")
    - {pattern: '\bzip\b|postal code',                              value_key: identity.address.zip}
    # "authorized to work in this COUNTRY?" is a Yes/No work-auth question, but the generic
    # \bcountry\b address rule below would grab it and fill "United States" (no Yes/No match).
    # So this MUST precede country. Renders "Yes" from work_authorization.authorized_us.
    # "right to work" is the same question in other words, and Adobe asks it as "can you
    # provide documentation establishing your identity and right to work..." — which a
    # green card answers Yes. It was missing, so a question fully covered by the profile
    # fell through to being asked. Not "right-to-work state" (US labour law, a different
    # thing entirely): require the work/employment sense by what follows it.
    - {pattern: 'authorized to work|legally authorized|eligible to work|right to work (in|for|at|here)|(documentation|proof|evidence).{0,40}right to work', value_key: work_authorization.authorized_us}
    # "Country of citizenship"/"Nationality" is an immigration question, NOT the mailing
    # address. The two differ for anyone living outside their country of citizenship,
    # which is every visa and permanent-resident case. MUST precede \bcountry\b, which
    # would otherwise silently fill the country of RESIDENCE — factually wrong, and wrong
    # on exactly the forms where the distinction is being checked.
    - {pattern: 'country of (citizenship|nationality)|citizenship country|\bnationality\b', value_key: work_authorization.citizenship_country}
    # Explicit residence phrasings first — these ARE asking for a country and do end in a
    # question mark, so they must be claimed before the no-question-mark guard below.
    - {pattern: 'country of residence|(what|which) country do you (live|reside)|country you (live|reside) in', value_key: identity.address.country}
    # A QUESTION MARK MEANS IT IS A QUESTION, NOT A FIELD LABEL. Verified live on Adobe's
    # Application Questions: "Are you of legal age to work in the country in which this
    # position will be based?" and "...can you provide documentation establishing your
    # identity and right to work in the country where this position will be based?" are
    # both Yes/No, and this rule answered "United States" to each. No such option exists so
    # nothing wrong was ever ticked — but a mis-routed question is reported as a failed
    # fill instead of being asked, which is the noisier and less honest of the two.
    # Address labels ("Country", "Country/Region") carry no "?", so the guard costs nothing.
    - {pattern: '^[^?]*\bcountry\b[^?]*$',                          value_key: identity.address.country}
    # A single free-text "Location" field (common as a Greenhouse React custom question):
    # no separate city/state boxes, so fill the full display string ("City, State,
    # Country"). Placed AFTER the granular city/state/zip/country rules so those still
    # win for structured address fields; won't match "relocation" (\b guards it).
    # (Combined "City, State" labels are handled by the dedicated rule above \bcity\b.)
    - {pattern: 'current location|^location(\s*\*)?$|where are you (based|located)|your current location', value_key: identity.location_display}
    # ORDER-SENSITIVE: "citizen OR permanent resident" -> Yes must precede bare "citizen" -> No,
    # and the status specifier must precede the yes/no "authorized to work" rule.
    - {pattern: 'citizen[^?.]{0,25}(\bor\b|/)[^?.]{0,25}(permanent resident|green ?card|national)|(permanent resident|green ?card)[^?.]{0,25}(\bor\b|/)[^?.]{0,25}citizen', value_key: work_authorization.authorized_us}
    # (Sponsorship rule moved to the very top of this bucket — see note there. It must
    # precede both the address \bcountry\b rule and the "visa status" rule below.)
    - {pattern: 'work.?authorization (status|type)|visa (status|type)|immigration status|residency status|what is your (work )?(auth\w*|status)', value_key: work_authorization.status}
    # Interrogative/bare citizenship-noun labels want the status STRING, not Yes/No —
    # "What is your citizenship?" as free text was getting "No" typed into it. MUST
    # precede the \bcitizen(ship)?\b yes/no rule below.
    - {pattern: 'what is your citizenship|citizenship status|^citizenship\s*[?:*]?\s*$', value_key: work_authorization.status}
    - {pattern: '\bcitizen(ship)?\b', value_key: work_authorization.us_citizen}
    - {pattern: 'authorized to work|legally authorized|work authorization|eligible to work', value_key: work_authorization.authorized_us}
    # (Both relocation rules moved up above the address block — see the note there. They
    # have to outrank \bcity\b, which was answering "are you willing to relocate near our
    # Foster City office?" with Parth's home city.)
    # EEO / voluntary self-identification — autofilled from profile.eeo (Parth's chosen answers)
    # `alternates`: "What gender pronouns do you prefer?" contains "gender", so this rule
    # beats the pronoun rule below and offered "Male" against He/Him | She/Her | Them/They
    # — flagged on every Robinhood run. The pronoun rule is NOT hoisted above this one on
    # purpose: that would change which rule wins for every gender question everywhere.
    # Falling back only when the gender value matches nothing is the narrower change.
    - {pattern: '\bgender\b|\bsex\b|gender identity',              value_key: eeo.gender, alternates: [eeo.pronouns]}
    # The standard US EEO block asks "Are you Hispanic or Latino?" as its own Yes/No
    # BEFORE race — route it to its own answer so it fills instead of escalating on
    # every Greenhouse form. The race rule below keeps hispanic|latino as a fallback for
    # combined race+ethnicity single-question forms.
    - {pattern: 'are you hispanic|hispanic or latino\??\s*$|of hispanic or latino (origin|descent)', value_key: eeo.hispanic_latino}
    - {pattern: '\brace\b|ethnic|hispanic|latino',                value_key: eeo.race_ethnicity}
    - {pattern: 'veteran',                                        value_key: eeo.veteran_status}
    - {pattern: 'disabilit|disabled',                             value_key: eeo.disability_status}
    # Extended demographics some ATSs add (e.g. Chime). "I identify as:" is a bare
    # gender-identity question (no "gender" keyword, so it misses the rule above);
    # "sexual orientation" dodges \bsex\b. Both route to their own profile.eeo values.
    - {pattern: 'sexual orientation',                             value_key: eeo.sexual_orientation}
    - {pattern: 'i identify as\b',                                value_key: eeo.gender_identity}
    # "Are you a person of transgender experience?" and similar LGBTQ demographic Y/N.
    - {pattern: 'transgender',                                    value_key: eeo.transgender}
    # Preferred pronouns (often a radio/checkbox group: He/Him, She/Her, They/Them).
    - {pattern: 'pronoun',                                       value_key: eeo.pronouns}
    # Consent to store/process demographic answers (GDPR-style checkbox). Distinct from
    # the background-check consent below (that one keys on "background"). Renders Yes -> checked.
    - {pattern: 'consent.*demographic|demographic.*(consent|data survey)', value_key: eeo.demographic_consent}
    # Privacy-policy / application-terms agreement ("By selecting 'I agree'... processed in
    # accordance with … Privacy Policy"). Deterministic Yes -> checks the box / picks "I agree"
    # (canon() maps "I agree" -> yes). Keyed on agreement wording, NOT bare "consent", so it
    # doesn't collide with the demographic-consent rule above.
    # "Check this box to confirm the statement above." — Adobe's Voluntary Disclosures
    # consent, and the phrasing points at a statement it does not repeat, so the label
    # alone never matched. Confirmed with Parth 2026-08-09: consent boxes fill from this
    # flag rather than pausing. Kept to confirm/acknowledge/agree — a box whose label says
    # what it opts you OUT of is a different question and must not land here.
    - {pattern: 'i agree|privacy policy|candidate privacy|processed in accordance|terms (and|&) conditions|by (checking|selecting|clicking|submitting)|check this box to (confirm|acknowledge|agree)', value_key: attestations.data_privacy_consent}
    # Prior / related affiliation disclosures -> all No (see profile.affiliations)
    # Question-anchored: the old broad previous(ly)+employ/work pattern captured résumé
    # history fields ("List your previous employers", "Describe your previous work
    # experience") and typed "No" into them. Every alternative now requires either an
    # interrogative lead-in or an employed-BY-someone construction.
    - {pattern: '(have you|were you|ever).{0,30}(employed|worked).{0,25}(here|\bus\b|by us|for us|with us|this company|the company|before)|previously (been )?(employed|worked) (by|at|for|with)|(are|were) you.{0,20}former (employee|staff)|former employee\b|prior employment (with|at|here)|rehire|subsidiar', value_key: affiliations.previously_employed}
    - {pattern: 'government (official|office|entity|owned|agency|institution|body)|public official|state-owned|politically exposed', value_key: affiliations.government_affiliation}
    - {pattern: 'external business|outside business|other business (activit|interest)|competing business|conflict of interest|business affiliation|employed by.{0,25}(customer|partner|client|vendor|supplier|competitor)|(work for|employed by).{0,25}(a )?(customer|partner|client)', value_key: affiliations.external_business}
    - {pattern: 'relative|family member|related to (a |an |any )?(current |former )?employee|know (anyone|someone) (who works|employed)', value_key: affiliations.related_to_employee}
    # Current employment (from resume). Anchored to bare-noun labels ("Current Employer")
    # or name-asking phrasings — the old loose patterns matched essay questions ("Why do
    # you want to leave your current employer?") and typed the employer name into textareas.
    # The end-anchors deliberately do NOT allow a trailing "?" — that's what excludes
    # question-sentences while keeping bare-noun labels (which never carry one).
    - {pattern: '(current|present|most recent) (employer|company)( name)?\s*[:*]?\s*$|name of (your )?(current |present )?employer|(company|employer) (do )?you (currently |presently )?work (for|at)|who is your (current |present )?employer', value_key: employment.current_employer}
    - {pattern: '(current|present|most recent) (job )?(title|role|position)\s*[:*]?\s*$|your (current |present )?(job )?title\s*[:*]?\s*$|what (is|was) your (current |present )?(job )?(title|role)\b', value_key: employment.current_title}
    # Education (from resume)
    - {pattern: 'school|university|college|institution|alma mater', value_key: education.school}
    # "Degree Type"/"education level" as a PICK-LIST (Bachelors/Masters/PhD/MBA) asks for the
    # LEVEL, not the credential name — route to degree_level so it matches an option. Must
    # precede the generic degree rule, which fills the free-text credential name instead.
    - {pattern: 'degree type|degree level|level of education|education level|highest level|what.{0,10}(is|was) your (highest )?(level|degree)', value_key: education.degree_level}
    - {pattern: '(highest )?(degree|qualification)', value_key: education.degree}
    # Anchored: bare "major"/"discipline" substrings matched "major professional
    # achievement" and "disciplined by a regulatory authority" (a standard disclosure at
    # fintech/quant firms) and typed "Computer Science" into them.
    - {pattern: '(academic )?major\s*[?:*]?\s*$|what (is|was) your.{0,15}major|major (of|in) |field of study|course of study|area of study|\bconcentration\b|academic discipline|\bdiscipline\s*[?:*]?\s*$', value_key: education.major}
    # Some forms ask for every GPA unconditionally — SpaceX asks Undergraduate, Graduate and
    # Doctorate as three required pick-lists. education.gpa holds the UNDERGRADUATE figure,
    # so letting the bare rule below answer the other two would assert degrees Parth does
    # not hold. Route them to the not-applicable row instead. \b before "graduate" is what
    # keeps this off "Undergraduate GPA", which the general rule must still get.
    - {pattern: '\bgpa\b[^?]{0,12}\((graduate|grad|masters?|doctorate|doctoral|phd)\)|\b(graduate|masters?|doctorate|doctoral|phd)\b[^?]{0,12}\bgpa\b', value_key: education.gpa_graduate}
    - {pattern: '\bgpa\b|cgpa|grade point', value_key: education.gpa}
    - {pattern: 'graduat\w* (date|year|in)|year of graduation|(expected|anticipated) graduation|completion date|when did you graduate', value_key: education.graduation_date}
    # Preferences (referral source lives at the top of this bucket — see note there)
    # In-office/hybrid ACKNOWLEDGMENT (a Yes/No commitment) must beat the work_arrangement
    # rule below, which would otherwise grab it on the word "hybrid" and answer with a
    # preference string instead of Yes.
    - {pattern: 'acknowledge.*(office|hybrid|days a week|in person|on-?site)|(required to|will be required).{0,25}(come into|in) the office|(available|able|willing) to (come|work) ?(on-?site|onsite)|come on-?site to work|commit\w*.{0,40}(office|on-?site|in person|anchor day)|(ok|okay|comfortable|fine|good) with.{0,40}(in-?office|on-?site|hybrid)', value_key: attestations.in_office_acknowledgment}
    # "How many days a week are you available to come into the office?" — a count, not a
    # Yes/No, so it must NOT hit the acknowledgment rule above (no "acknowledge"/"available
    # to work onsite" wording) nor the work_arrangement string rule below. Renders full
    # availability (Parth is open to all arrangements).
    - {pattern: 'how many days.*(office|on-?site|in person|come in)|days (a|per) week.*(office|on-?site|in person|come in)', value_key: preferences.office_days_available}
    # `alternates`: "Are you willing to work from the office(s) listed on the job
    # description?" is a Yes/No, but this rule renders the preference SENTENCE ("Open to
    # remote, hybrid, or onsite") which matches no option — flagged live on Robinhood.
    # The in-office acknowledgment (true -> "Yes") is the same commitment in Yes/No form,
    # so it is the correct second try; free-text arrangement fields never reach it.
    - {pattern: '\bremote\b|hybrid|on-?site|in-office|work arrangement|willing to work (in|from|on-?site)', value_key: preferences.work_arrangement, alternates: [attestations.in_office_acknowledgment]}
    - {pattern: 'preferred (location|city|work location)|desired (location|work location)|location preference|locations? (of interest|you.{0,15}(open|interested))|open to (which )?locations|where would you like to work', value_key: preferences.locations}
    # Attestations (yes/no; booleans render Yes/No)
    - {pattern: 'at least 18|18 (years )?(of age|or older)|are you (at least |over )?18|over 18|minimum age|of legal (working )?age', value_key: attestations.age_18_or_older}
    - {pattern: 'background (check|screen|investigation)|consent to.*background', value_key: attestations.background_check_consent}
    - {pattern: 'security clearance|(hold|have|active|current).{0,15}clearance|clearance level', value_key: attestations.security_clearance}
    - {pattern: 'non-?compete|noncompete|restrictive covenant|bound by (any )?(agreement|contract)|prior (employment )?agreement', value_key: attestations.non_compete}
    - {pattern: 'accommodat', value_key: attestations.interview_accommodations_needed}
    - {pattern: 'convicted|criminal (history|record|background|conviction|offense)|felony|misdemeanor|ever been (arrested|convicted|charged)|plead\w* guilty', value_key: attestations.criminal_history}
    # Have you interviewed/applied here before? -> No (fresh applications; per-company
    # override can flip it). "interviewed"/"applied" aren't in the previously_employed rule
    # above (that keys on employ/work), so no collision.
    - {pattern: 'ever (interviewed|applied)|previously (interviewed|applied)|interviewed (here|with|at|before)|applied (here|to (us|this)|before|previously)', value_key: attestations.previously_applied_or_interviewed}

  # --- Tier 2: Claude drafts, user approves. answer_key indexes answer_bank.yaml ---
  draftable:
    - {pattern: 'why (do you want to |are you interested|would you like ).*?(work|join|company|us|here)|why (this company|our company|us\b)', answer_key: why_company}
    - {pattern: 'why (this|the) role|why (are you|were you) (interested|drawn).*role|why do you want this (job|position|role)', answer_key: why_role}
    # The "what excites you" family. Every rule above keys on "why" + a want-verb, so the
    # whole excitement phrasing fell through to bucket None and had to be drafted by hand on
    # every board. These keys are DELIBERATELY absent from answer_bank.yaml: the bank wins
    # over Claude whenever it has a row, and these questions are too company-specific for a
    # canned answer to be worth reusing, so a miss is what routes them to a fresh draft.
    # Role before company: a prompt that asks both ("...why you're applying to work here.
    # What excited you about this role?") is really asking about the role.
    - {pattern: 'what (excite[sd]?|interest(s|ed)?|draws?|drew|attract(s|ed)?|appeal(s|ed)?).{0,40}\b(role|position|job|opportunity|opening)\b|why (are|were) you (excited|interested|drawn).{0,40}\b(role|position|job|opportunity|opening)\b', answer_key: role_excitement}
    - {pattern: 'what (excite[sd]?|interest(s|ed)?|draws?|drew|attract(s|ed)?|appeal(s|ed)?).{0,40}(\bus\b|our (company|team|mission|work)|this company|the company|working here|join(ing)? us)|what (drew|drove|brought) you to\b', answer_key: company_excitement}
    # Mission/values essays ("our purpose is X — what does that mean to you?"). Anchored on
    # the "means to you" side so it can't grab a factual question that merely says "mission".
    - {pattern: '(purpose|mission|values?)\b.{0,60}(means? to you|resonates?|matters? to you)|what.{0,40}(purpose|mission|values?).{0,20}mean', answer_key: values_mission}
    - {pattern: 'cover letter',                                     answer_key: cover_letter}
    - {pattern: 'greatest strength|biggest strength|your strength', answer_key: biggest_strength}
    - {pattern: 'weakness|area.*improv|area.*develop',              answer_key: biggest_weakness}
    - {pattern: 'tell us about yourself|about you\b|introduce yourself', answer_key: about_you}
    # Behavioral / "walk us through a..." prompts — proudest achievement, a challenging
    # project, a time you did X. Draftable so Claude drafts from the bank + Parth approves.
    - {pattern: 'proudest|greatest (achievement|accomplishment)|most (proud|significant|impressive|challenging).{0,30}(achievement|accomplishment|project|work|problem)|walk us through.{0,30}(achievement|accomplishment|project|time)|describe a (time|project|situation|challenge)|tell (us|me) about a (time|project|challenge|situation)', answer_key: behavioral}
    - {pattern: 'anything else|additional (info|information|comments)|is there anything', answer_key: anything_else}

  # --- always ask the user; never silently filled ---
  always_ask:
    - {pattern: 'salary|compensation expectation|desired (pay|compensation)|expected (pay|salary|compensation)|pay expectation|(hourly|pay) rate|\bwage\b'}
    - {pattern: 'current (salary|compensation|ctc|pay)'}
    - {pattern: 'years of (experience|professional)|how many years|minimum.*years'}
    - {pattern: 'notice period|when can you (start|begin)|start date|availability|available to start|earliest.{0,20}(start|begin|join)|(any )?(deadlines?|timeline)( considerations?)?|when.{0,20}(would you|can you).{0,20}(start|begin|join)'}

# --- Per-company overrides: patterns here are prepended to that bucket for the named
#     company only. Use to force a dream company's open-ended Qs to manual review, etc.
overrides:
  # "Jane Street":
  #   always_ask:
  #     - {pattern: 'why (jane street|jane|us)'}
