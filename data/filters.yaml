# Everything here is editable. The career paths and levels follow the feed sources.
# 10 was discarding ~93% of the eligible pool: measured against the 2026-07-29 dump,
# 10d gave 64 eligible roles, 30d gives 161, no limit at all gives 852. Widened 2026-08-01.
freshness_days: 30

# Whole-list sources, fetched IN ADDITION to every board in companies.yaml. companies.yaml
# can only find roles at companies already on it; a feed is how employers nobody thought to
# add get discovered at all. Everything below still goes through the same paths /
# seniority / location / freshness filters — a feed entry is a lead, not a verdict.
#
# Roles whose posting URL is on a board the extension has no adapter for do NOT enter
# queue.json. They are written to out/manual.json and shown in the console as apply-by-hand
# (see the module docstring in core/scraper.py). Set `enabled: false` to turn a feed off.
sources:
  - name: SimplifyJobs New-Grad
    format: simplify
    enabled: true
    # The bot-maintained JSON behind github.com/SimplifyJobs/New-Grad-Positions. `dev` is
    # the branch its bot writes to; `main` lags. ~12MB, one GET per run.
    url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
  - name: VC portfolio jobs (early career)
    format: vcjobs
    enabled: true
    # The JSON behind jobs.ypatodkar.com/?career=early: engineering roles across 16 VC
    # portfolios, refreshed twice daily. ~6MB, one GET per run. The parser keeps only
    # rows the site tags `career: early`.
    url: https://jobs.ypatodkar.com/api/all-jobs.json
  - name: a16z speedrun talent network
    format: speedrun
    enabled: true
    # The JSON behind speedrun-talent-network.com: engineering roles, new grad to senior,
    # 0-5 years, posted in the last 24h, across the a16z portfolio and beyond. Paged 50 rows
    # at a time, plus one GET per row to read its apply link (~45 rows a day).
    url: https://speedrun-talent-network.com/api/jobs?fn=engineering&lvl=new_grad,junior,mid,senior&yoe=_,1_2,3_5&posted=24h&scope=everywhere

# The career paths you can search. Pick yours on the console's Search page, which saves
# the choice to search.yaml. Without a search.yaml, paths marked `default: true` are
# searched.
#
# Each path is also a resume track. You upload one resume per path you pick, and a job
# from a path gets that path's resume.
#   keywords:         title words that put a job in this path. A title that matches no
#                     chosen path is dropped. Keywords match as whole words, with an
#                     optional plural "s".
#   resume_keywords:  words in a job description that point to this path's resume. The
#                     resume picker uses them when a job has no path. They become the
#                     track's `keywords` in profile.json, where you can edit them.
#
# Order sets priority: a title goes to the first path, from the top, with a matching
# keyword. So "Quant Developer" goes to quant, "Security Software Engineer" goes to
# security, and "Software Engineer in Test" goes to qa, all before general software.
#
# Bare "engineer" and bare "analyst" are deliberately absent. Measured on 2026-08-01, they
# pulled in Sales, Solutions, and Support Engineer and Business Analyst roles (+152 and +59
# at 30 days, mostly irrelevant).
paths:
  quant:
    label: Quant research and trading
    default: true
    keywords: [quant, quantitative]
    resume_keywords: [quant, quantitative, trading, trader, hft, systematic, alpha, derivatives]
  security:
    label: Cybersecurity
    default: false
    # Bare "security" catches "Software Engineer, Security". It is only searched when you
    # pick this path.
    keywords: [security, cybersecurity, appsec, penetration tester, pentester, soc analyst,
               threat intelligence, incident response, detection engineer, red team]
    resume_keywords: [security, vulnerability, threat, siem, soc, incident response,
                      penetration testing, owasp, iam, cryptography, malware, forensics]
  qa:
    label: QA and test engineering
    default: false
    keywords: [qa, quality assurance, test engineer, sdet, software engineer in test,
               software development engineer in test, test automation, automation engineer,
               quality engineer]
    resume_keywords: [qa, testing, test automation, selenium, cypress, playwright, test plan,
                      regression, quality assurance, sdet]
  ai:
    label: AI and machine learning
    default: true
    keywords: [machine learning, ml engineer, "ai/ml", ai engineer, llm, genai, generative ai,
               forward deployed, deep learning, research scientist, research engineer,
               applied scientist, computer vision, nlp, natural language processing, mlops,
               ml infrastructure, ml platform, ml systems]
    resume_keywords: [machine learning, ml, ai, artificial intelligence, deep learning, nlp,
                      llm, genai, generative ai, agentic, computer vision, mlops, inference,
                      applied scientist, research engineer, research scientist]
  data_engineering:
    label: Data engineering
    default: false
    keywords: [data engineer, analytics engineer, etl developer, data platform engineer]
    resume_keywords: [data engineer, etl, data pipeline, spark, airflow, kafka, dbt,
                      data warehouse, snowflake, bigquery]
  ds:
    label: Data science
    default: true
    keywords: [data scientist, data science, decision scientist, statistician]
    resume_keywords: [data scientist, data science, decision scientist, statistics,
                      statistician, experimentation, a/b testing, causal inference]
  analytics:
    label: Data and business analytics
    default: false
    keywords: [data analyst, business analyst, business intelligence, bi engineer,
               bi developer, product analyst]
    resume_keywords: [sql, tableau, power bi, looker, dashboard, reporting, kpi, excel]
  devops:
    label: DevOps, SRE, and cloud
    default: false
    keywords: [devops, site reliability, sre, platform engineer, infrastructure engineer,
               cloud engineer, cloud architect, build engineer, release engineer,
               reliability engineer]
    resume_keywords: [kubernetes, terraform, aws, gcp, azure, ci/cd, docker, observability,
                      linux, ansible, on-call]
  embedded:
    label: Embedded and firmware
    default: false
    keywords: [embedded, firmware]
    resume_keywords: [firmware, embedded, rtos, microcontroller, embedded linux,
                      device driver, bare metal]
  hardware:
    label: Hardware and chip design
    default: false
    keywords: [hardware engineer, asic, fpga, rtl, design verification, verification engineer,
               chip design, silicon engineer, electrical engineer]
    resume_keywords: [verilog, systemverilog, vhdl, fpga, asic, rtl, uvm, pcb, timing closure]
  robotics:
    label: Robotics and autonomy
    default: false
    keywords: [robotics, autonomy, autonomous, perception engineer, controls engineer,
               motion planning]
    resume_keywords: [ros, slam, perception, controls, motion planning, kinematics,
                      sensor fusion]
  mobile:
    label: Mobile (iOS and Android)
    default: false
    keywords: [ios, android, mobile engineer, mobile developer, react native, flutter]
    resume_keywords: [ios, android, swift, kotlin, swiftui, jetpack compose, react native,
                      flutter]
  frontend:
    label: Frontend and web
    default: false
    keywords: [frontend, front end, web developer, web engineer, ui engineer]
    resume_keywords: [react, javascript, typescript, css, html, frontend, vue, angular,
                      next js, accessibility]
  game:
    label: Game development
    default: false
    keywords: [game developer, game engineer, game programmer, gameplay, graphics engineer,
               unity developer, unreal]
    resume_keywords: [unity, unreal, gameplay, graphics, opengl, directx, vulkan, shaders]
  network:
    label: Network engineering
    default: false
    keywords: [network engineer, network administrator, network architect]
    resume_keywords: [cisco, ccna, routing, switching, bgp, ospf, firewall, tcp/ip, vpn]
  it:
    label: IT support and systems administration
    default: false
    keywords: [it support, help desk, helpdesk, desktop support, system administrator,
               systems administrator, sysadmin, it specialist, it technician]
    resume_keywords: [active directory, windows server, office 365, troubleshooting,
                      ticketing, jamf, intune, itil]
  database:
    label: Database engineering and administration
    default: false
    keywords: [database administrator, dba, database engineer, database developer,
               sql developer]
    resume_keywords: [sql, postgresql, mysql, oracle, query optimization, replication,
                      indexing, backup]
  solutions:
    label: Solutions and sales engineering
    default: false
    keywords: [solutions architect, solutions engineer, sales engineer, customer engineer,
               implementation engineer]
    resume_keywords: [customer, pre-sales, demo, integration, proof of concept, stakeholder,
                      architecture]
  design:
    label: UX and product design
    default: false
    keywords: [ux designer, ui designer, product designer, ux researcher, interaction designer]
    resume_keywords: [figma, user research, prototyping, wireframes, design systems,
                      usability]
  tech:
    label: Software engineering (backend, full stack, general)
    default: true
    keywords: [software engineer, software developer, swe, sde, member of technical staff,
               new grad, backend, back end, full stack, fullstack, product engineer,
               systems engineer, distributed systems, application developer]
    resume_keywords: [software, engineer, developer, backend, full stack, fullstack, platform,
                      swe, sde, distributed systems, member of technical staff, new grad]

# Experience levels, read from the job title. A title gets the first level, from the
# bottom of this list up, with one of its `titles` words. A title with none is entry.
# Pick yours on the Search page. Without a search.yaml, levels marked `default: true` are
# kept. Many "Senior" postings list 2 to 4 years, so mid is on by default (2026-08-01).
levels:
  entry: {label: Entry (0-3 years), default: true, titles: []}
  mid: {label: Mid (4-10 years), default: true, titles: [senior, sr]}
  senior:
    {label: Senior (10+ years), default: false,
     titles: [staff, principal, lead, manager, director, head, vp, vice president,
              distinguished, "10 years", "8 years"]}

seniority:
  # Always dropped if the title contains any of these as a whole word, whatever the level.
  exclude: [intern, internship, phd]

location:
  # us_only is an ALLOWLIST: a role is kept only if its location shows a positive US
  # signal (state name, uppercase state abbreviation, a known US city, or "US"/"USA").
  # It used to be denylist-only, so anything not in exclude_locations below passed --
  # that is how "Reykjavik" and bare "Hybrid" reached the queue.
  us_only: true

  # What to do with a location that is neither excluded nor recognisably US.
  # drop (default) | keep. Each run prints the ones it couldn't place, so if a real US
  # role ends up here, add its city to include_locations rather than flipping this.
  unknown_locations: drop

  # Second chance for the "unknown" bucket only. Boards routinely file real US roles as
  # "Hybrid" / "In-Office" / "Remote" / "N/A" and keep the geography elsewhere in the
  # payload (Greenhouse offices[].name + "Job Posting Location" metadata, Ashby
  # address.postalAddress.addressCountry, Workday country.descriptor). When the location
  # itself can't be placed, that secondary evidence is judged by these SAME rules.
  # It is not a blanket "keep unknowns": a hint of "Remote India" is still excluded, and
  # each rescued role is printed at the end of the run so a bad hint is visible.
  # Set false to go back to dropping every unplaceable location.
  keep_unknown_if_us: true

  # Extra strings that COUNT AS US (word-bounded). For offices the built-in city list
  # doesn't know. exclude_locations still wins over anything listed here.
  include_locations: []

  # dropped if the location string contains any of these (extend as you hit noise).
  # Checked FIRST, so it overrides every allow signal.
  exclude_locations:
    [india, gurugram, gurgaon, bengaluru, bangalore, hyderabad, pune, noida, chennai, mumbai,
     london, uk, united kingdom, ireland, dublin, canada, toronto, vancouver, montreal,
     germany, berlin, munich, france, paris, netherlands, amsterdam, spain, madrid, barcelona,
     portugal, lisbon, poland, warsaw, romania, bucharest, singapore, tokyo, sydney, melbourne,
     mexico, brazil, sao paulo, argentina, colombia, latam,
     remote emea, remote apac, remote europe, remote latam, remote canada, remote india]
